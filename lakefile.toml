name = "hex-bareiss"
defaultTargets = ["HexBareiss"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "v0.4.0"

[[require]]
name = "HexDeterminant"
git = "https://github.com/leanprover/hex-determinant.git"
rev = "v0.4.0"

[[require]]
name = "HexArith"
git = "https://github.com/leanprover/hex-arith.git"
rev = "v0.4.0"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "v0.4.0"

[[lean_lib]]
name = "HexBareiss"
precompileModules = true
